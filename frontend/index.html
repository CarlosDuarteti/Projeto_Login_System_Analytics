<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System</title>

    <link rel="stylesheet" href="./css/styleDark.css">
    <link href="https://fonts.googleapis.com/css2?family=Vampiro+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <!-- Botão para alterar o tema da tela de dark para tema claro-->

    <button id="themeToggle" class="theme-toggle-btn">🌙</button>

    <!-- div principal de login. A classe login-container usada no css -->
    <div class="login-container">

        <!-- título principal da página -->
        <h1> Login</h1>
        <!-- Paragrafos são textos auxiliares de instruções para usuário -->
        <p>Acesse sua conta</p>

        <form>

            <div class="input-group">
                <label for="email">Email</label>
                <!-- Campo de entrada do email. Type email é um validador do nosso próprio validador -->
                <input id="email" type="email" placeholder="Digite seu email"><br>
                <label for="senha">Senha</label>
                <!-- Campo de entrada da senha. Type password mascara o que for digitado no campo senha -->
                <input id="senha" type="password" placeholder="Digite sua senha"><br>
                <button type="submit">Entrar</button>
            </div>

        </form>

        <div class="footer">
            <span>Não tem conta?</span>
            <a href="./register.html">Criar conta</a>

        </div>
    </div>

    <!-- ========================================
Criando modal global
=========================================-->


    <div id="customAlert" class="alert-overlay">
        <div class="alert-box">
            <h3 id="alertTitle">Aviso</h3>
            <p id="alertMessage">mensagem</p>
            <button type="button" id="btnAlertConfirm">
                OK, ENTENDI
            </button>
        </div>
    </div>

    <script src="./JS/theme.js"></script>
    <script src="./JS/modal.js"></script>
    <script src="./JS/login.js"></script>
</body>

</html>
